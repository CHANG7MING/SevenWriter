<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">SevenWriter：先守住事实，再把话写对</title>
  <desc id="desc">左侧介绍 SevenWriter 的写作质量控制能力，右侧人物在灰色虎斑猫陪伴下校核、改写并复审稿件。</desc>
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#1d1d1b" opacity=".12"/>
    </pattern>
  </defs>
  <rect width="1600" height="720" fill="#f7f1e7"/>
  <rect width="1600" height="720" fill="url(#dots)"/>

  <g fill="#1d1d1b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif">
    <text x="88" y="126" font-size="66" font-weight="800" letter-spacing="1">SEVENWRITER</text>
    <rect x="88" y="164" width="590" height="8" rx="4"/>
    <text x="88" y="224" font-size="28" font-weight="750">先守住事实，再把话写对</text>
    <text x="88" y="270" font-size="21" fill="#4d4a44">面向 AI Agent 的中文写作与质量控制 Skill</text>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif">
    <rect x="88" y="316" width="208" height="86" rx="18" fill="#5f86b5"/>
    <text x="114" y="349" font-size="17" font-weight="750" fill="#fff">事实保真</text>
    <text x="114" y="378" font-size="15" fill="#fff">数字、专名、边界不丢</text>
    <rect x="316" y="316" width="208" height="86" rx="18" fill="#7d6aa3"/>
    <text x="342" y="349" font-size="17" font-weight="750" fill="#fff">场景适配</text>
    <text x="342" y="378" font-size="15" fill="#fff">渠道不同，各有尺度</text>
    <rect x="544" y="316" width="176" height="86" rx="18" fill="#6d9d68"/>
    <text x="570" y="349" font-size="17" font-weight="750" fill="#fff">独立复核</text>
    <text x="570" y="378" font-size="15" fill="#fff">每一分都有理由</text>
  </g>

  <g fill="#1d1d1b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif">
    <text x="88" y="493" font-size="22" font-weight="750">EVIDENCE → DRAFT → REVIEW</text>
    <text x="88" y="534" font-size="17" fill="#4d4a44">资料校核 · 场景主笔 · 独立终审</text>
    <path d="M88 590 H700" stroke="#1d1d1b" stroke-width="2" opacity=".25"/>
    <text x="88" y="635" font-size="16" fill="#4d4a44">创作 / 改写 / 诊断 / 文档处理 / 可执行评分</text>
  </g>

  <image href="hero-subject.png" x="760" y="34" width="810" height="630" preserveAspectRatio="xMidYMid meet"/>
  <circle cx="1128" cy="662" r="9" fill="#5f86b5"/>
  <circle cx="1160" cy="662" r="9" fill="#6d9d68"/>
  <circle cx="1192" cy="662" r="9" fill="#e7b84b"/>
</svg>
